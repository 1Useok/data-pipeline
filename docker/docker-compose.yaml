x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  dns:
    - 1.1.1.1
    - 8.8.8.8
  environment:
    - DATA_DB_PATH=/data_db
    - KIS_APP_KEY=${PROD_KIS_APP_KEY:-}
    - KIS_APP_SECRET=${PROD_KIS_APP_SECRET:-}
    - KIS_BASE_URL=${PROD_BASE_URL:-https://openapi.koreainvestment.com:9443}
    - KIS_TASK_TIMEOUT_HOURS=${KIS_TASK_TIMEOUT_HOURS:-5}
    - KIS_TASK_RETRIES=${KIS_TASK_RETRIES:-3}
    - KIS_MAX_FAILED_COUNT=${KIS_MAX_FAILED_COUNT:-0}
    - KIS_MAX_FAILED_RATIO=${KIS_MAX_FAILED_RATIO:-0}
    - KIS_MAX_UNEXPECTED_NO_DATA_COUNT=${KIS_MAX_UNEXPECTED_NO_DATA_COUNT:-1}
    - KIS_MAX_UNEXPECTED_NO_DATA_RATIO=${KIS_MAX_UNEXPECTED_NO_DATA_RATIO:-0}
    - KIS_SILENT_SKIP_WARN_RATIO=${KIS_SILENT_SKIP_WARN_RATIO:-0.05}
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    - TZ=Asia/Seoul
    - AIRFLOW__CORE__DEFAULT_TIMEZONE=Asia/Seoul
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD=1800
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - PYTHONPATH=/opt/airflow:/opt/airflow/packages:/opt/airflow/dags
  volumes:
    - ../dags:/opt/airflow/dags
    - ../packages:/opt/airflow/packages
    - ../config:/opt/airflow/config
    - ../tests:/opt/airflow/tests:ro
    - pipeline_data:/data_db
    - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow dags reserialize &&
        (airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true) &&
        airflow dags unpause --yes --treat-dag-id-as-regex '.*'
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    # The Windows watchdog starts this only after the SMB drvfs mount is ready.
    restart: "no"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    # The Windows watchdog starts this only after the SMB drvfs mount is ready.
    restart: "no"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dashboard:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - streamlit run /opt/airflow/dashboard/app.py --server.port 8050 --server.address 0.0.0.0
    ports:
      - "8050:8050"
    volumes:
      - ../dashboard:/opt/airflow/dashboard
      - ../dags:/opt/airflow/dags
      - ../packages:/opt/airflow/packages
      - pipeline_data:/data_db
    # The Windows watchdog starts this only after the SMB drvfs mount is ready.
    restart: "no"

volumes:
  pipeline_data:
    external: true
    name: pipeline_smb_data
  postgres_data:
  airflow_logs:
